name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version-file: .ruby-version
          bundler-cache: true

      - run: bundle exec rubocop --parallel

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # The fallback path is the stock vips transformer, so the suite needs a
      # real libvips: half the assertions compare imgproxy's bytes against what
      # vips would have produced.
      - name: Install libvips
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libvips-dev

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version-file: .ruby-version
          bundler-cache: true

      - run: bundle exec rake test
